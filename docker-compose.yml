services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bi_user
      POSTGRES_PASSWORD: bi_pass
      POSTGRES_DB: bi_demo
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "55432:5432"   # 便于本机直接连库核对；可按需去掉
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bi_user -d bi_demo"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://bi_user:bi_pass@db:5432/bi_demo
      MODEL_PATH: /data/model.json
      AUTO_SEED: "1"
      STATEMENT_TIMEOUT_MS: "15000"
      DEFAULT_LIMIT: "1000"
      MAX_LIMIT: "10000"
    volumes:
      - modeldata:/data
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
  modeldata:
